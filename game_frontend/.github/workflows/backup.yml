name: Backup Flutter App

on:
  push:
    branches-ignore: 
      - main
      - gh-pages
  workflow_dispatch:  # Allow manual triggering

jobs:
  backup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
        with:
          clean: true
      
      - name: Create clean .gitignore
        run: |
          echo "*.iml" > .gitignore
          echo ".dart_tool/" >> .gitignore
          echo "build/" >> .gitignore
          echo ".flutter-plugins" >> .gitignore
          echo ".flutter-plugins-dependencies" >> .gitignore
          
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.10.0'
          channel: 'stable'
      
      - run: flutter pub get
      - run: flutter build web --release
      
      - name: Create backup branch
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'
          timestamp=$(date +%Y%m%d-%H%M%S)
          git checkout -b backup-${timestamp}
          git add -f build/
          git commit -m "Backup build from ${GITHUB_REF_NAME} at ${timestamp}"
          git push origin backup-${timestamp}
